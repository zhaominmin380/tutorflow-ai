services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutorflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tutorflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tutorflow:password@postgres:5432/tutorflow}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SESSION_EXPIRE_DAYS: ${SESSION_EXPIRE_DAYS:-30}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-8}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      AI_LOG_RETENTION_DAYS: ${AI_LOG_RETENTION_DAYS:-90}
      AI_DATA_PROCESSING_CONSENT_CONFIRMED: ${AI_DATA_PROCESSING_CONSENT_CONFIRMED:-false}
      DATABASE_SCHEMA_MANAGED_BY_ALEMBIC: "true"
      WATCHFILES_FORCE_POLLING: "true"
    command:
      ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/tutorflow-ai:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  frontend_node_modules:
